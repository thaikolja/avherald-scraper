[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avherald-scraper"
version = "2.0.0"
description = "Extract AV Herald listing headlines into SQLite"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "httpx>=0.28.1",
    # 4.15.1 stops AnyIO's pytest plugin importing the removed CallSpec2 name.
    "anyio>=4.15.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
[project.scripts]
avherald-scraper = "avherald_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
